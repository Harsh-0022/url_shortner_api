services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: url-shortener-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: url-shortener-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "URL Shortener API"
      ENVIRONMENT: "production"
      BASE_URL: "http://localhost:8000"
      DATABASE_URL: "sqlite:////app/data/shortener.db"
      VALKEY_URL: "valkey://valkey:6379/0"
    volumes:
      - ./data:/app/data
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
